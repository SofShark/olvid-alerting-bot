services:
  # 1
  nuxt_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: olvid-nuxt-web
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/data/alerting.db
      - OLVID_DAEMON_URL=http://daemon:50051
      - OLVID_CLIENT_KEY=34f52581-a6b7-47d0-9201-e7437ac6aa64
    # SMTP_* (and any other secrets) come from the untracked .env at the
    # project root. `.env.example` documents the expected keys.
    env_file:
      - .env
    # SQLite lives on the host — bind-mounted so the file survives container
    # recreation. `./data/` is git-ignored; created on first boot by
    # `prisma db push` (see Dockerfile CMD).
    volumes:
      - ./data:/data
    depends_on:
      - daemon
    restart: unless-stopped

  # 2. El Daemon de Olvid (El cerebro del bot)
  daemon:
    image: olvid/bot-daemon:2.0.1
    environment:
      - OLVID_ADMIN_CLIENT_KEY_CLI=8942311-9b8c-4e5a-9c3d-123456789abc
    ports:
      - 50052:50051
    volumes:
      - ./data:/daemon/data
      - ./data/app_configuration.properties:/opt/conf/app_configuration.properties
  # 4. CLI de Olvid (Herramienta para emparejar el bot con tu móvil)
  cli:
    image: olvid/bot-python-runner:2.0.1
    entrypoint: "olvid-cli"
    environment:
      - OLVID_ADMIN_CLIENT_KEY=8942311-9b8c-4e5a-9c3d-123456789abc
      - OLVID_DAEMON_URL=http://daemon:50051
    stdin_open: true
    tty: true
    profiles: ["cli"]

